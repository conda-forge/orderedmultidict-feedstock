{% set name = "orderedmultidict" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/orderedmultidict-{{ version }}.tar.gz
  sha256: 16a7ae8432e02cc987d2d6d5af2df5938258f87c870675c73ee77a0920e6f4a6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - six >=1.8.0

test:
  imports:
    - orderedmultidict
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gruns/orderedmultidict
  summary: 'Ordered Multivalue Dictionary - omdict.'
  license: Unlicense
  license_file: LICENSE.md
  dev_url: https://github.com/gruns/orderedmultidict
  doc_url: https://github.com/gruns/orderedmultidict

extra:
  recipe-maintainers:
    - pmlandwehr
    - fhoehle
